name = "f95launcher-stats"
main = "src/index.js"
compatibility_date = "2026-09-01"
# Not a secret; needed because account-owned API tokens cannot look it up.
account_id = "d166286035506436e8301afa6efa49ef"

# Daily cleanup of old per-day rows.
[triggers]
crons = ["17 3 * * *"]

[vars]
GITHUB_REPO = "maxbaydi/f95-game-zone-app"

[[d1_databases]]
binding = "DB"
database_name = "f95launcher-stats"
database_id = "ed7f5f26-d092-423e-8552-5e109e59235f"

# The dashboard and /v1/stats need a secret token. The "Stats worker"
# workflow uploads it from the STATS_TOKEN repository secret; by hand:
#   npx wrangler secret put STATS_TOKEN
