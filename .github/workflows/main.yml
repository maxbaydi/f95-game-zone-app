name: Release

# Release assets are built into a draft for a version tag, never
# for a plain push to main: main is the working branch and every push there
# used to rebuild and overwrite the installers of the current release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Clean npm cache
        run: npm cache clean --force
        if: matrix.os == 'windows-latest'
        shell: pwsh

      - name: Clean npm cache (Linux)
        run: npm cache clean --force
        if: matrix.os == 'ubuntu-latest'
        shell: bash

      - name: Install dependencies
        run: npm ci
        if: matrix.os == 'windows-latest'
        shell: pwsh

      - name: Install dependencies (Linux)
        run: npm ci
        if: matrix.os == 'ubuntu-latest'
        shell: bash

      - name: Verify release version
        run: node -e "const p=require('./package.json'),l=require('./package-lock.json');if(p.version!==l.version||p.version!==l.packages[''].version)throw Error('Version mismatch');if(process.env.GITHUB_REF.startsWith('refs/tags/')&&process.env.GITHUB_REF_NAME!=='v'+p.version)throw Error('Tag does not match package version');"

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm
        shell: bash

      - name: Validate release
        run: npm run ci:check

      - name: Build and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_DRAFT: 'true'
        run: npm run publish
        if: matrix.os == 'windows-latest'
        shell: pwsh

      - name: Build and publish (Linux)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_DRAFT: 'true'
        run: |
          npm run build:ui
          npx electron-builder --linux --x64 -p always
        if: matrix.os == 'ubuntu-latest'
        shell: bash

      - name: Verify packaged UI (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run check:package
        shell: pwsh

      - name: Verify packaged UI (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/check-packaged-ui.js dist/linux-unpacked/resources/app.asar
        shell: bash
