<!doctype html>
<html lang="en" data-motion="auto">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>F95Launcher Settings</title>
    <link rel="stylesheet" href="./assets/vendor/fonts.css" />
    <link rel="stylesheet" href="./assets/vendor/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="./assets/css/tailwind.output.css" />
    <link rel="stylesheet" href="./assets/css/main.css" />
  </head>
  <body class="text-text antialiased">
    <div id="atlas-boot" class="atlas-boot" data-state="loading" role="status">
      <img class="atlas-boot__logo" src="./assets/images/logo.png" alt="" draggable="false" />
      <div class="atlas-boot__title">Settings</div>
      <div class="atlas-boot__bar atlas-progress-indeterminate atlas-keep-motion"></div>
      <div class="atlas-boot__status">Opening settings…</div>
      <div class="atlas-boot__error" role="alert">
        <strong data-boot-error-title>The interface could not start</strong>
        <div data-boot-error-message></div>
        <pre data-boot-error-details></pre>
        <div class="atlas-boot__actions">
          <button type="button" data-primary data-boot-action="reload">Reload</button>
          <button type="button" data-boot-action="copy">Copy details</button>
          <button type="button" data-boot-action="close">Close window</button>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script src="./core/ui/atlas-ui.js"></script>
    <script src="./web-preview-api.js"></script>
    <script src="./scrollbar-reveal.js"></script>
    <script src="./assets/vendor/react/react.production.min.js"></script>
    <script src="./assets/vendor/react-dom/react-dom.production.min.js"></script>
    <script src="./assets/vendor/babel/babel.min.js"></script>
    <script src="./core/ui/atlas-react.js"></script>
    <script src="./shared/cloudSyncErrors.js"></script>
    <script type="text/babel" src="./core/cloud/CloudAuthPanel.jsx"></script>
    <script type="text/babel" src="./core/settings/settingsKit.jsx"></script>
    <script
      type="text/babel"
      src="./core/settings/GeneralSettings.jsx"
    ></script>
    <script
      type="text/babel"
      src="./core/settings/LibrarySettings.jsx"
    ></script>
    <script type="text/babel" src="./core/settings/CloudSync.jsx"></script>
    <script
      type="text/babel"
      src="./core/settings/SaveStorageSettings.jsx"
    ></script>
    <script
      type="text/babel"
      src="./core/settings/EmulatorLauncher.jsx"
    ></script>
    <script type="text/babel" src="./core/settings/SettingsPanel.jsx"></script>
    <script type="text/babel" src="./core/settings/Settings.jsx"></script>
  </body>
</html>
